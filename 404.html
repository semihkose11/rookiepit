<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="cerez.js"></script>
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı · rookiepit.com</title>
<link rel="icon" href="favicon.svg">
<style>
html{-webkit-text-size-adjust:100%}
:root{color-scheme:light;
 --ground:#EFE9FB;--surface:#FFF;--sunk:#E4DBF7;
 --ink:#000;--body:#141019;--mute:#463E58;--hair:#CFC2EC;--acc:#5B21B6;
 --disp:"Barlow Condensed",system-ui,sans-serif;
 --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);font:400 16px/1.65 var(--sans);
 min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 20px 60px}
main{max-width:520px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
h1{font:700 clamp(34px,8vw,52px)/1.04 var(--disp);color:var(--ink);margin:12px 0 0;letter-spacing:-.01em}
p{margin:16px 0 0;color:var(--mute)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 0}
a.btn{font:600 14px/1 var(--sans);border-radius:999px;padding:13px 18px;text-decoration:none;
 border:1px solid var(--hair);background:var(--surface);color:var(--body)}
a.btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
a.btn:hover{background:var(--sunk)}
a.btn.solid:hover{background:var(--acc);border-color:var(--acc)}
.cright{margin:38px 0 0;padding:18px 0 0;border-top:1px solid var(--hair);
 font:500 12px/1.6 var(--mono);color:var(--mute)}
</style>
</head>
<body>
<main lang="tr">
  <div class="eyebrow" lang="en">404</div>
  <h1>Bu sayfa yok</h1>
  <p>Aradığınız adres taşınmış veya hiç var olmamış olabilir. Modül adları
  değiştiyse ana sayfadan devam edin.</p>
  <div class="cta">
    <a class="btn solid" href="/rookiepit/">Ana sayfa</a>
    <a class="btn" href="/rookiepit/moduller.html">Modüller</a>
  </div>
  <p class="cright">© 2026 Semih Tuna Köse</p>
</main>
</body>
</html>
