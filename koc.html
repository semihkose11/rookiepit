<style>
html{-webkit-text-size-adjust:100%}
:root{color-scheme:light;
 --ground:#EFE9FB;--surface:#FFF;--sunk:#E4DBF7;
 --ink:#000;--body:#141019;--mute:#463E58;--hair:#CFC2EC;
 --acc:#5B21B6;--ok:#116336;--ok-soft:#E4F3EA;--no:#A5124A;--no-soft:#FBE6EE;
 --warn:#8A5A00;--warn-soft:#FDF0DC;
 --shadow:0 1px 2px rgba(40,24,80,.09),0 8px 24px rgba(40,24,80,.08);
 --disp:"Barlow Condensed",system-ui,sans-serif;
 --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);font:400 16px/1.6 var(--sans)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 70px}
header{padding:36px 0 22px;border-bottom:1px solid var(--hair);
 display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
h1{font:700 clamp(30px,6vw,44px)/1.04 var(--disp);color:var(--ink);margin:8px 0 0}
.sagust{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-left:auto}
.who{font:500 12.5px/1.5 var(--mono);color:var(--mute);text-align:right}
.who b{display:block;color:var(--ink);font-size:14px}
.lnk{font:500 12.5px/1 var(--mono);color:var(--body);background:var(--surface);
 border:1px solid var(--hair);border-radius:999px;padding:9px 13px;cursor:pointer;
 text-decoration:none;display:inline-block;margin:8px 0 0 6px}
.lnk:hover{background:var(--sunk)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0}
.fbtn{font:500 12.5px/1 var(--mono);color:var(--body);background:var(--surface);
 border:1px solid var(--hair);border-radius:999px;padding:9px 13px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.msg{margin:22px 0 0;padding:13px 15px;border-radius:11px;font-size:14px}
.msg.bad{background:var(--no-soft);color:#6D0B31;border:1px solid #EBB3C9}
.msg.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #E8C68A}
.bol{margin-top:30px}
.bol:first-child{margin-top:22px}
.bhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bico{width:12px;height:12px;border-radius:4px;flex:none}
.bhead h2{font:700 clamp(20px,3.4vw,26px)/1.1 var(--disp);letter-spacing:.01em;
  margin:0;color:var(--ink)}
.bmeta{font:500 12px/1 var(--mono);color:var(--mute)}
.scroll{margin-top:12px;overflow-x:auto;border:1px solid var(--hair);border-radius:13px;
 background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font:400 13px/1.4 var(--sans)}
th,td{padding:9px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--hair)}
tbody tr:last-child td{border-bottom:0}
th.ad,td.ad{position:sticky;left:0;background:var(--surface);text-align:left;
 min-width:170px;border-right:1px solid var(--hair);z-index:2}
thead th{position:sticky;top:0;background:var(--sunk);font:600 11px/1.3 var(--mono);
 color:var(--mute);z-index:3}
thead th.ad{z-index:4;background:var(--sunk)}
thead th.dept{font:600 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#fff}
td.ad b{display:block;font:600 14px/1.35 var(--sans);color:var(--ink)}
td.ad span{font:500 11px/1.4 var(--mono);color:var(--mute)}
.cell{display:inline-block;min-width:46px;border-radius:7px;padding:5px 6px;
 font:600 11.5px/1.2 var(--mono)}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-re{background:var(--no-soft);color:var(--no)}
.c-go{background:var(--warn-soft);color:var(--warn)}
.c-new{color:#B4AAC8}
.sum{font:600 12px/1.2 var(--mono)}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.key{margin:16px 0 0;display:flex;flex-wrap:wrap;gap:16px;font:500 12px/1.5 var(--mono);color:var(--mute)}
.key span{display:flex;align-items:center;gap:6px}
.key s{width:12px;height:12px;border-radius:3px;display:block;text-decoration:none}
.cright{margin:40px 0 0;padding:20px 0 0;border-top:1px solid var(--hair);font:500 12px/1.6 var(--mono);color:var(--mute);text-align:center}
</style>

<style>
/* ---- sol ust menu (gezinme) ---------------------------------------- */
body{padding-top:56px}
.nvbtn{position:fixed;left:14px;top:10px;z-index:70;width:44px;height:40px;
  display:flex;flex-direction:column;justify-content:center;gap:5px;
  padding:0 10px;border:1px solid var(--hair);border-radius:10px;
  background:var(--surface);cursor:pointer;box-shadow:var(--shadow,0 1px 2px rgba(40,24,80,.09))}
.nvbtn span{display:block;height:2px;border-radius:2px;background:var(--ink)}
.nvbtn:hover{border-color:var(--acc)}
.nvbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.nvback{position:fixed;inset:0;z-index:80;background:rgba(20,16,25,.44)}
.nvpanel{position:fixed;left:0;top:0;bottom:0;z-index:90;width:min(330px,86vw);
  overflow-y:auto;background:var(--surface);border-right:1px solid var(--hair);
  padding:18px 16px 28px;box-shadow:0 0 40px rgba(40,24,80,.22)}
.nvhead{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:var(--acc);padding:0 4px 14px}
.nvtop{display:flex;flex-direction:column;gap:2px;padding:0 0 10px;
  border-bottom:1px solid var(--hair);margin-bottom:12px}
.nvtop[hidden]{display:none}   /* hidden tek basina yetmiyor: display kurali eziyor */
.nvtop a{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;
  color:var(--body);font:500 14.5px/1.3 var(--sans)}
.nvtop a:hover{background:var(--acc-soft);color:var(--acc)}
.nvdept{font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);padding:14px 4px 7px}
.nvlist a{display:grid;grid-template-columns:30px 1fr auto;align-items:baseline;gap:8px;
  padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--body)}
.nvlist a:hover{background:var(--acc-soft)}
.nvnum{font:600 12px/1.4 var(--mono);color:var(--mute)}
.nvttl{font:500 14.5px/1.35 var(--sans)}
.nvok{font:600 10px/1.4 var(--mono);color:var(--ok);text-transform:uppercase;letter-spacing:.06em}
.nvhere{background:var(--sunk)}
.nvhere .nvttl{font-weight:700;color:var(--ink)}
.nvhere .nvnum{color:var(--acc)}
.nvlock{margin:6px 4px 0;font:400 12.5px/1.5 var(--sans);color:var(--mute)}
.nvnote{margin:14px 4px 0;padding-top:12px;border-top:1px solid var(--hair);
  font:400 12.5px/1.55 var(--sans);color:var(--mute)}
.nvbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 0 12px}
.nvbar .nvhead{padding:0 4px}
.nvx{width:34px;height:34px;flex:none;border:1px solid var(--hair);border-radius:8px;
  background:var(--surface);color:var(--mute);font:400 20px/1 var(--sans);cursor:pointer}
.nvx:hover{border-color:var(--acc);color:var(--acc)}
.nvx:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media print{.nvbtn,.nvpanel,.nvback{display:none}body{padding-top:0}}
</style>
</head>

<script>
var MODS=[{"dept":"electrical","n":"00","id":"electrical-00-tools","q":8,"title":"Aletler: Elektrik Ekibinin Takım Çantası"},{"dept":"electrical","n":"01","id":"electrical-01-power-path","q":9,"title":"Power Path: Battery'den PD'ye"},{"dept":"electrical","n":"02","id":"electrical-02-circuit-protection","q":8,"title":"Circuit Protection: Branch Breaker ve Fuse Seçimi"},{"dept":"electrical","n":"03","id":"electrical-03-can-bus","q":8,"title":"CAN Bus: Zincir, Termination ve Device ID"},{"dept":"electrical","n":"04","id":"electrical-04-radio","q":8,"title":"Radio: Besleme, Bağlantı ve Status Lights"},{"dept":"electrical","n":"05","id":"electrical-05-brownout","q":8,"title":"Brownout: Voltage Sag ve Current Draw"},{"dept":"electrical","n":"06","id":"electrical-06-status-lights","q":8,"title":"Status Lights: roboRIO, RSL ve PD"},{"dept":"electrical","n":"07","id":"electrical-07-pneumatics","q":8,"title":"Pneumatics: Basınç Bölgeleri, Koruma ve Besleme"},{"dept":"electrical","n":"08","id":"electrical-08-motors","q":8,"title":"Motorlar ve Motor Controller'lar"},{"dept":"electrical","n":"09","id":"electrical-09-custom-circuits","q":8,"title":"Custom Circuit'ler ve Legal Wiring"},{"dept":"electrical","n":"10","id":"electrical-10-wire-management","q":8,"title":"Wire Management, Strain Relief ve Bakım"},{"dept":"electrical","n":"11","id":"electrical-11-control-system","q":8,"title":"Kontrol Sistemi Bütünlüğü: roboRIO, MXP ve Co-Processor"},{"dept":"electrical","n":"12","id":"electrical-12-inspection","q":8,"title":"Inspection Points: Elektrik Denetimi Baştan Sona"},{"dept":"programming","n":"00","id":"programming-00-java-vscode","q":8,"title":"Temel Java ve VS Code"},{"dept":"programming","n":"00b","id":"programming-00b-wpilib-temelleri","q":8,"title":"WPILib Temelleri"},{"dept":"programming","n":"01","id":"programming-01-project-structure","q":8,"title":"Proje Yapısı ve Robot Yaşam Döngüsü"},{"dept":"programming","n":"02","id":"programming-02-deploy","q":8,"title":"Deploy ve Driver Station Bağlantısı"},{"dept":"programming","n":"03","id":"programming-03-command-based","q":8,"title":"Command-Based Temelleri"},{"dept":"programming","n":"04","id":"programming-04-subsystems","q":8,"title":"Subsystem'ler ve Default Command'ler"},{"dept":"programming","n":"05","id":"programming-05-motor-controllers","q":8,"title":"Motor Controller'ları Koddan Sürmek"},{"dept":"programming","n":"06","id":"programming-06-triggers","q":8,"title":"Joystick ve Tuş Bağlamaları"},{"dept":"programming","n":"07","id":"programming-07-sensors","q":8,"title":"Sensor'ler: Encoder, Limit Switch ve Gyro"},{"dept":"programming","n":"08","id":"programming-08-pid","q":8,"title":"Closed-Loop Kontrol ve PIDController"},{"dept":"programming","n":"09","id":"programming-09-telemetry","q":8,"title":"Telemetry ve Driver Station Loglarıyla Hata Ayıklama"},{"dept":"programming","n":"10","id":"programming-10-autonomous","q":8,"title":"Autonomous Rutinleri ve SendableChooser"},{"dept":"programming","n":"11","id":"programming-11-simulation","q":8,"title":"Simulation ve Unit Test"},{"dept":"programming","n":"12","id":"programming-12-competition","q":8,"title":"Yarışmaya Hazırlık ve Yazılım Denetimi"},{"dept":"cad","n":"01","id":"cad-01-onshape-basics","q":8,"title":"Onshape'e Giriş: Document, Part Studio ve Assembly"},{"dept":"cad","n":"02","id":"cad-02-sketching","q":8,"title":"Sketch Temelleri ve Kısıtlanma Durumu"},{"dept":"cad","n":"03","id":"cad-03-constraints","q":8,"title":"Sketch Constraint'leri ve Tasarım Niyeti"},{"dept":"cad","n":"04","id":"cad-04-features","q":8,"title":"Feature'lar ve Extrude'un End Condition'ları"},{"dept":"cad","n":"05","id":"cad-05-variables-configurations","q":8,"title":"Variable'lar ve Configuration'lar"},{"dept":"cad","n":"06","id":"cad-06-in-context","q":8,"title":"Multi-Part Part Studio ve In-Context Tasarım"},{"dept":"cad","n":"07","id":"cad-07-mates","q":8,"title":"Assembly Mate'leri ve Mate Connector"},{"dept":"cad","n":"08","id":"cad-08-versions-branches","q":8,"title":"Version, Branch ve Merge"},{"dept":"cad","n":"09","id":"cad-09-drawings","q":8,"title":"Drawing: Teknik Resim ve Güncelleme"},{"dept":"cad","n":"10","id":"cad-10-cots-imports","q":8,"title":"COTS Parçalar, Import ve Linked Document"},{"dept":"cad","n":"11","id":"cad-11-robot-rules","q":8,"title":"Robot Kuralları ve CAD"},{"dept":"cad","n":"12","id":"cad-12-design-review","q":8,"title":"Capstone: CAD Tasarım İncelemesi"}], ACC={"electrical": "#B45309", "programming": "#0E7490", "cad": "#6D28D9"}, LABEL={"electrical": "Elektrik", "programming": "Programlama", "cad": "CAD"}, PASS=70;
var DEPT=["electrical","programming","cad"];
var TAM={electrical:"Elektrik ve Kablolama", programming:"Programlama", cad:"CAD"};
var $=function(s){return document.querySelector(s);};
var el=function(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;};
var filtre="all", VERI=null;

function uyar(tip,metin){ $("#uyari").innerHTML=""; var p=el("p","msg "+tip,metin); $("#uyari").append(p); }

/* Kurulum tuvali olmayan modul: gecme olcutu yalnizca test puanidir.
   Modul listesi bunu sayfadan okuyor; burada acikca listelenir. Bu
   olmadan electrical-00 mentor tablosunda hicbir zaman gecmis
   gorunmuyordu, oysa ogrenci onu gecip sonraki module geciyordu. */
var TUVALSIZ={"electrical-00-tools":true};

function durum(tuval, dogru, cevaplanan, q, tuvalsiz){
  if(cevaplanan===0 && (tuvalsiz || tuval===null)) return {k:"new", t:"—"};
  if(cevaplanan<q || (!tuvalsiz && tuval===null)) return {k:"go", t:(cevaplanan)+"/"+q};
  var test=Math.round(dogru/q*100);
  var ort = tuvalsiz ? test : Math.round((test+tuval)/2);
  return {k: ort>=PASS?"ok":"re", t:"%"+ort, ort:ort};
}

function ciz(){
  var host=$("#bolumler"); host.innerHTML="";
  var ogr=VERI.ogrenciler.filter(function(o){
    return o.rol!=="mentor" && o.rol!=="admin" && o.rol!=="koc";
  });
  /* Her bolum kendi basligi ve kendi tablosuyla ayri durur; filtre
     dugmeleri hangi bolumlerin gosterilecegini secer. */
  DEPT.filter(function(d){ return filtre==="all" || d===filtre; })
    .forEach(function(d){
      var mods=MODS.filter(function(m){ return m.dept===d; });
      if(!mods.length) return;

      var sec=el("section","bol"); sec.dataset.d=d;
      var h=el("div","bhead");
      var ico=el("span","bico"); ico.style.background=ACC[d];
      h.append(ico);
      h.append(Object.assign(el("h2"),{textContent:TAM[d]}));
      var bitiren=0;
      var satirlar=ogr.map(function(o){
        var gecen=0;
        var hucreler=mods.map(function(m){
          var tv=VERI.tuvalMap[o.id+"|"+m.id];
          var cv=VERI.cevapMap[o.id+"|"+m.id]||{d:0,n:0};
          var s=durum(tv===undefined?null:tv, cv.d, cv.n, m.q, !!TUVALSIZ[m.id]);
          if(s.k==="ok") gecen++;
          return s;
        });
        if(gecen===mods.length) bitiren++;
        return {o:o, hucreler:hucreler, gecen:gecen};
      });
      h.append(Object.assign(el("span","bmeta"),
        {textContent: mods.length+" modül · bölümü tamamlayan "
          + bitiren+" / "+ogr.length+" öğrenci"}));
      sec.append(h);

      var t2=el("table");
      var thead=el("thead"), r1=el("tr");
      r1.append(Object.assign(el("th","ad"),{textContent:"Öğrenci"}));
      mods.forEach(function(m){
        var th=el("th",null,m.n); th.title=m.title; r1.append(th);
      });
      r1.append(Object.assign(el("th",null),{textContent:"Geçilen"}));
      thead.append(r1); t2.append(thead);

      var tb=el("tbody");
      satirlar.forEach(function(r){
        var tr=el("tr");
        var td=el("td","ad");
        td.append(Object.assign(el("b"),{textContent:r.o.ad}));
        tr.append(td);
        r.hucreler.forEach(function(s){
          var c=el("td");
          c.append(Object.assign(el("span","cell c-"+s.k),{textContent:s.t}));
          tr.append(c);
        });
        tr.append(Object.assign(el("td","sum"),
          {textContent:r.gecen+" / "+mods.length}));
        tb.append(tr);
      });
      t2.append(tb);

      var sc=el("div","scroll"); sc.append(t2);
      sec.append(sc); host.append(sec);
    });

  $("#bolumler").hidden = ogr.length===0;
  $("#bos").hidden = ogr.length>0;
}

[].forEach.call(document.querySelectorAll(".fbtn"),function(b){
  b.onclick=function(){
    filtre=b.dataset.d;
    [].forEach.call(document.querySelectorAll(".fbtn"),function(x){
      x.setAttribute("aria-pressed", x===b?"true":"false");});
    if(VERI) ciz();
  };
});

/* Verilen seciciye uyan ogeleri gizler; yoksa sessizce gecer. */
function gizle(seciciler){
  seciciler.forEach(function(s){
    var n=document.querySelectorAll(s);
    for(var i=0;i<n.length;i++){ n[i].hidden=true; n[i].style.display="none"; }
  });
}
if(!window.FRC){
  /* sync.js yüklenmemiş: sayfa yanındaki dosyalar olmadan açılmış. */
  uyar("bad","Bu sayfa tek başına çalışmaz: yanında config.js ve sync.js dosyaları bulunmalıdır. Dosyayı indirip tek başına açtıysanız, bunun yerine programın klasörünü açıp aynı klasördeki sayfayı kullanın.");
} else if(!FRC.acik){
  uyar("warn","Sunucu ayarlanmamış. config.js dosyasındaki url ve key alanları doldurulmadan mentör tablosu çalışmaz.");
} else {
  FRC.korumaliSayfa().then(function(devam){
    if(!devam) return;
    var k=FRC.kullanici();
    $("#kim").textContent=k.ad; $("#rol").textContent=k.eposta;
    FRC_DISLI.kur($("#dkutu"), k, {buSayfa:"koc.html", ust:true});
    if(!(k.rol==="mentor" || k.rol==="admin" || k.rol==="koc")){
      /* Ogrenci hesabinda sayfa iskeleti de gorunmesin: yalnizca uyari kalir. */
      gizle(['.tools', '.key', '#bolumler', '#bos']);
      uyar("bad","Bu sayfa yalnızca mentör ve admin hesaplarına açıktır. Öğrenci hesabıyla giriş yaptınız.");
      return;
    }
    return FRC.ozet().then(function(v){
      VERI={ogrenciler:v.ogrenciler, tuvalMap:{}, cevapMap:{}};
      v.tuval.forEach(function(t){ VERI.tuvalMap[t.kullanici+"|"+t.modul]=t.puan; });
      v.cevap.forEach(function(c){
        var k2=c.kullanici+"|"+c.modul;
        VERI.cevapMap[k2]=VERI.cevapMap[k2]||{d:0,n:0};
        VERI.cevapMap[k2].n++; if(c.dogru) VERI.cevapMap[k2].d++;
      });
      ciz();
    });
